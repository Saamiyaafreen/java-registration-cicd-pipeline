apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-registration-app
  labels:
    app: java-registration-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-registration-app
  template:
    metadata:
      labels:
        app: java-registration-app
    spec:
      containers:
        - name: java-registration-app
          image: saamiya16/java-registration-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
